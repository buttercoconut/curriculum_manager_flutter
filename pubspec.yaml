name: curriculum_manager_flutter
description: A Flutter frontend for the Curriculum Manager system.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ">=2.18.0 <3.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.5
  provider: ^6.0.5
  cupertino_icons: ^1.0.2
  intl: ^0.18.0
  flutter_localizations:
    sdk: flutter
  fluttertoast: ^8.2.1
  firebase_messaging: ^14.7.0
  flutter_secure_storage: ^8.0.0
  json_annotation: ^4.8.1
  # Add other dependencies as needed
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.6.1
flutter:
  uses-material-design: true
  assets:
    - assets/
